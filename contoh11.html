<!DOCTYPE html>
<html>
    <body>

        <h2>Contoh Switch</h2>

        <p id="demo"></p>

        <script>
            var x = 1;

            switch (x) {
                case 1:
                    text = "Angka satu";
                    break;
                case 2:
                    text = "Angka dua";
                    break;
                default:
                    text = "Tidak ada ketenrangan";
            }
            document.getElementById("demo").innerHTML = text;
        </script>
    </body>
</html>
